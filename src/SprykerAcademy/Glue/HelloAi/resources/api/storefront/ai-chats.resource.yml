resource:
    name: AiChats
    shortName: ai-chats
    description: 'Sends a message to an LLM through AiFoundation and returns the answer. The conversation reference gives the LLM memory.'

    # TODO-1: Point API Platform at the class that handles the request.
    # Hint-1: The key is "processor" and the value is the fully qualified class name of AiChatsStorefrontProcessor.
    # Hint-2: A GET resource uses "provider" instead. Compare vendor/spryker/agent-auth-rest-api/resources/api/storefront/agent-customer-impersonation-access-tokens.resource.yml
    paginationEnabled: false

    # TODO-2: Declare one operation of type "Post" with uriTemplate '/ai-chats'.
    # Hint: Add "normalizationContext: { gen_id: false }" to the operation, the resource has no identifier.
    operations: []

    properties:
        message:
            type: string
            writable: true
            readable: true
            required: true
            description: 'The message for the LLM.'
            openapiContext:
                example: 'Hello world!'

        # TODO-3: Declare the "conversationReference" property (type string).
        # The client SENDS it to continue a conversation and READS it back to learn the reference of a new conversation.
        # Hint: writable: true, readable: true, required: false. Add a description, it ends up in the OpenAPI documentation.

        # TODO-4: Declare the "answer" property (type string). It is read-only: readable, not writable.
